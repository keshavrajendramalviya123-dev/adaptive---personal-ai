
{% extends "base.html" %}

{% block content %}

<section class="dashboard-page">

    <header class="topbar">
        <div>
            <div class="eyebrow">STAY ORGANIZED</div>
            <h1>My <span>Weekly Tasks</span> ▤</h1>
            <p class="muted">
                Manage your work and stay productive with
                Personalized AI Assistance.
            </p>
        </div>
    </header>

    <section class="dashboard-bottom">
        <div class="dashboard-card">
            <h3>Plan Your Week</h3>
            <p>Keep your weekly goals and activities organized.</p>

            <div class="task-form">
                <input
                    id="task-input"
                    class="neon-input"
                    type="text"
                    placeholder="Enter a new task..."
                >

                <button id="add-task-btn" class="neon-submit">
                    Add Task +
                </button>
            </div>

            <div id="task-list"></div>
        </div>
    </section>

</section>

{% endblock %}
