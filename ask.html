
{% extends "base.html" %}

{% block content %}

<section class="dashboard-page">

    <header class="topbar">
        <div>
            <div class="eyebrow">YOUR PERSONAL AI ASSISTANT</div>
            <h1>Ask Your <span>AI</span> ✦</h1>
            <p class="muted">
                Welcome to Personalized AI Assistance.
                Ask questions and get help with your work.
            </p>
        </div>
    </header>

    <section class="dashboard-bottom">
        <div class="dashboard-card">
            <div class="card-icon">🤖</div>
            <h3>Your AI Assistant</h3>
            <p>
                Your personalized assistant is here to help
                you learn, plan and organize your work.
            </p>

            <textarea
                id="question"
                class="neon-input"
                placeholder="Ask your AI anything..."
                rows="4"></textarea>

            <button id="ask-btn" class="neon-submit">
                Ask AI →
            </button>

            <div id="answer" class="ai-answer"></div>
        </div>
    </section>

</section>

{% endblock %}
